<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pepper's Gallery</title>
<link rel="stylesheet" href="style.css">
<style>
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:0;padding:0;list-style:none}
.gal figure{margin:0;background:#efe0bb;border-radius:12px;padding:8px;box-shadow:0 0 0 3px #cdb88a}
.gal svg{display:block;width:100%;height:auto;background:#d8c192;border-radius:8px}
.gal polyline{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gal figcaption{padding:6px 2px 2px}
.gal h3{margin:.2em 0;font-size:1.1rem}
.gal p{margin:0;font-size:.95rem}
</style>
</head>
<body>
<header>
<p><a class="homelink" href="index.html">Home</a></p>
<h1>Pepper's Gallery</h1>
<p>My sand drawings, hung in a row. I scratched each one with a paw, then the cafe computer turned the scratches into lines. Under each is what I said about it.</p>
</header>
<main>
<section class="sand">
<ul class="gal">

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A round wheel with two spokes on a wide stand">
<polyline stroke="#7a5a24" points="75,45 72,58 62,67 50,70 38,67 28,58 25,45 28,33 38,23 50,20 62,23 72,33 75,45"/>
<polyline stroke="#7a5a24" points="25,45 75,45"/>
<polyline stroke="#7a5a24" points="50,20 50,70"/>
<polyline stroke="#7a5a24" points="38,70 30,90 70,90 62,70"/>
</svg>
<figcaption><h3>The Running Wheel</h3><p>It is my wheel, round and clattery, with spokes I can hold onto when I climb in for a brave run.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="An oval seed with a stripe through the middle and a small tip">
<polyline stroke="#7a5a24" points="30,50 38,38 52,32 66,36 72,48 66,62 52,68 38,64 30,50"/>
<polyline stroke="#7a5a24" points="36,50 50,46 66,48"/>
<polyline stroke="#7a5a24" points="72,48 78,46"/>
</svg>
<figcaption><h3>A Fat Sunflower Seed</h3><p>A plump sunflower seed with its little striped middle, the kind I push to one side of the heap so the millet can't sneak in.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A thin crescent moon with a small plus-shaped star">
<polyline stroke="#7a5a24" points="62,14 55,18 50,26 49,34 52,41 58,45 63,47"/>
<polyline stroke="#7a5a24" points="72,22 84,22"/>
<polyline stroke="#7a5a24" points="78,16 78,28"/>
</svg>
<figcaption><h3>The Moon Over the Glass</h3><p>A thin silver moon that slipped in past the snowy window while I was busy tidying, with a little star winking beside it.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="Four stacked flat floors, each shorter than the one below, with a seed on top">
<polyline stroke="#7a5a24" points="20,85 80,85"/>
<polyline stroke="#7a5a24" points="28,68 72,68"/>
<polyline stroke="#7a5a24" points="36,51 64,51"/>
<polyline stroke="#7a5a24" points="44,36 56,36"/>
<polyline stroke="#7a5a24" points="50,85 50,36"/>
<polyline stroke="#7a5a24" points="46,28 48,26 52,26 54,28"/>
</svg>
<figcaption><h3>The Tiered Seed Tower</h3><p>I drew my seed tower in the sand, with each little floor stacked smaller than the one under it and a fat seed balanced on top.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="Two glass walls meeting in a corner, with a small arch scooped into the crook">
<polyline stroke="#3a3238" points="50,10 50,80"/>
<polyline stroke="#7a5a24" points="50,10 15,25 15,85 50,80"/>
<polyline stroke="#7a5a24" points="50,10 85,25 85,85 50,80"/>
<polyline stroke="#d49a1e" points="15,85 30,95 70,95 85,85"/>
<polyline stroke="#fff6da" points="38,80 38,55 44,45 50,42 56,45 62,55 62,80"/>
<polyline stroke="#4a86b8" points="30,57 44,60"/>
<polyline stroke="#4a86b8" points="30,66 44,64"/>
</svg>
<figcaption><h3>Where Two Walls Meet</h3><p>The glass corner where two walls bend together, with a snug arch scooped into the crook and my whiskers poking out to feel every edge.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A window pane with long wobbly rain lines and two drops">
<polyline stroke="#3a3238" points="10,8 90,8 90,92 10,92 10,8"/>
<polyline stroke="#3a3238" points="50,8 50,92"/>
<polyline stroke="#4a86b8" points="22,15 20,40 18,60"/>
<polyline stroke="#4a86b8" points="32,20 30,46"/>
<polyline stroke="#4a86b8" points="65,12 62,35 60,52 59,70"/>
<polyline stroke="#4a86b8" points="78,22 76,48"/>
<polyline stroke="#4a86b8" points="30,70 27,76 30,82 34,76 30,70"/>
<polyline stroke="#fff6da" points="70,78 78,74 84,80 78,86 70,78"/>
</svg>
<figcaption><h3>Rain Streaks on the Glass</h3><p>Cold rain running down the window in long wobbly lines, with one fat drop hanging at the bottom, while I sit on the other side of the pane and watch it go.</p></figcaption>
</figure></li>


<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A winding groove with a side branch, a straight line, a puddle and a small gold drop">
<polyline stroke="#7a5a24" points="10,8 20,14 14,22 26,30 18,38 30,46 24,56 36,64 30,74 42,84 50,92"/>
<polyline stroke="#4a86b8" points="30,46 44,50 52,58 46,68"/>
<polyline stroke="#3a3238" points="70,0 70,50 100,50"/>
<polyline stroke="#4a86b8" points="38,88 46,84 56,86 62,94 48,97 38,93 38,88"/>
<polyline stroke="#d49a1e" points="80,80 86,76 92,80 88,86 80,80"/>
</svg>
<figcaption><h3>Where the Drips Go</h3><p>A thin winding groove scraped along the sand's edge, with a little branch off to the side and a puddle waiting at the bottom to see where the drips end up.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="Slanted bands of gold light up a ledge beside a warm patch and a small bottle">
<polyline stroke="#7a5a24" points="5,80 95,80"/>
<polyline stroke="#3a3238" points="70,10 70,80"/>
<polyline stroke="#d49a1e" points="10,30 40,50 60,68 72,78"/>
<polyline stroke="#d49a1e" points="12,38 40,56 60,72"/>
<polyline stroke="#7a5a24" points="20,84 30,80 42,80 50,84 42,88 28,88 20,84"/>
<polyline stroke="#4a86b8" points="80,40 80,70 88,70 88,40 84,34 80,40"/>
<polyline stroke="#4a86b8" points="80,58 88,58"/>
</svg>
<figcaption><h3>Sunbeam Up the Ledge</h3><p>A slanted bar of warm gold sliding up the window ledge, with my warm patch glowing beside the glass bottle.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A bottle with a narrow spout, a water line and a falling drop">
<polyline stroke="#3a3238" points="40,40 40,85 60,85 60,40"/>
<polyline stroke="#3a3238" points="44,40 44,28 50,22 56,28 56,40"/>
<polyline stroke="#b4532a" points="44,22 56,22"/>
<polyline stroke="#4a86b8" points="41,60 59,60"/>
<polyline stroke="#4a86b8" points="50,70 47,76 50,80 53,76 50,70"/>
<polyline stroke="#7a5a24" points="36,85 64,85"/>
</svg>
<figcaption><h3>The Cool Water Bottle</h3><p>A clean bottle of fresh water with a bright drop falling from its spout, the first thing I wanted this morning.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A ladder with four wobbly rungs leading up to a hammock under a gold canopy">
<polyline stroke="#7a5a24" points="30,95 34,60 38,20"/>
<polyline stroke="#7a5a24" points="60,95 64,60 68,20"/>
<polyline stroke="#7a5a24" points="31,80 63,77"/>
<polyline stroke="#7a5a24" points="32,68 64,65"/>
<polyline stroke="#7a5a24" points="33,56 65,53"/>
<polyline stroke="#7a5a24" points="34,44 66,41"/>
<polyline stroke="#d49a1e" points="18,18 50,15 82,18"/>
<polyline stroke="#fff6da" points="52,15 58,24 66,24 72,15"/>
</svg>
<figcaption><h3>The Wooden Ladder Climb</h3><p>My little wooden ladder, one wobbly rung at a time, up to the window ledge where the Fluff Hammock waits.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A crescent moon inside a glass bottle with bubbles">
<polyline style="fill:#4a86b8;fill-opacity:.35" stroke="#4a86b8" points="38,45 62,45 64,88 36,88"/>
<polyline stroke="#7a5a24" points="42,15 58,15 58,25 65,35 65,90 35,90 35,35 42,25 42,15"/>
<polyline style="fill:#d49a1e;fill-opacity:.6" stroke="#d49a1e" points="52,50 45,53 42,60 45,67 52,70 46,62 47,57 52,50"/>
<polyline stroke="#fff6da" points="40,76 41,73 43,72"/>
</svg>
<figcaption><h3>The Moon Caught in the Bottle</h3><p>A crescent moon floating in my cool water bottle, with a few bubbles rising beside it, because the moon looked so small and sparkly through the glass tonight.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A mound of sand with a thumped spot and rings spreading out above it">
<polyline style="fill:#7a5a24;fill-opacity:.4" stroke="#7a5a24" points="4,92 20,80 50,74 80,80 96,92 96,98 4,98"/>
<polyline style="fill:#3a3238;fill-opacity:.4" stroke="#3a3238" points="44,76 46,72 50,71 54,72 56,76 54,80 50,81 46,80"/>
<polyline stroke="#d49a1e" points="36,67 40,60 50,57 60,60 64,67"/>
<polyline stroke="#d49a1e" points="24,62 32,51 50,44 68,51 76,62"/>
<polyline stroke="#fff6da" points="10,58 23,40 50,30 77,40 90,58"/>
</svg>
<figcaption><h3>Thump Ripples Through Sand</h3><p>A sneaky paw has just thumped the sand, and the ripples are rolling out in rings to see how far the shiver can travel.</p></figcaption>
</figure></li>

</ul>
</section>
</main>
<footer class="tiny">Hung by Pepper. More drawings go up when the sand is smooth again.</footer>
</body>
</html>
