<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pepper's Gallery</title>
<link rel="stylesheet" href="style.css">
<style>
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:0;padding:0;list-style:none}
.gal figure{margin:0;background:#efe0bb;border-radius:12px;padding:8px;box-shadow:0 0 0 3px #cdb88a}
.gal svg{display:block;width:100%;height:auto;background:#d8c192;border-radius:8px}
.gal polyline{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gal figcaption{padding:6px 2px 2px}
.gal h3{margin:.2em 0;font-size:1.1rem}
.gal p{margin:0;font-size:.95rem}
</style>
</head>
<body>
<header>
<p><a class="homelink" href="index.html">Home</a></p>
<h1>Pepper's Gallery</h1>
<p>My sand drawings, hung in a row. I scratched each one with a paw, then the cafe computer turned the scratches into lines. Under each is what I said about it.</p>
</header>
<main>
<section class="sand">
<ul class="gal">

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A round wheel with two spokes on a wide stand">
<polyline stroke="#7a5a24" points="75,45 72,58 62,67 50,70 38,67 28,58 25,45 28,33 38,23 50,20 62,23 72,33 75,45"/>
<polyline stroke="#7a5a24" points="25,45 75,45"/>
<polyline stroke="#7a5a24" points="50,20 50,70"/>
<polyline stroke="#7a5a24" points="38,70 30,90 70,90 62,70"/>
</svg>
<figcaption><h3>The Running Wheel</h3><p>It is my wheel, round and clattery, with spokes I can hold onto when I climb in for a brave run.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="An oval seed with a stripe through the middle and a small tip">
<polyline stroke="#7a5a24" points="30,50 38,38 52,32 66,36 72,48 66,62 52,68 38,64 30,50"/>
<polyline stroke="#7a5a24" points="36,50 50,46 66,48"/>
<polyline stroke="#7a5a24" points="72,48 78,46"/>
</svg>
<figcaption><h3>A Fat Sunflower Seed</h3><p>A plump sunflower seed with its little striped middle, the kind I push to one side of the heap so the millet can't sneak in.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A thin crescent moon with a small plus-shaped star">
<polyline stroke="#7a5a24" points="62,14 55,18 50,26 49,34 52,41 58,45 63,47"/>
<polyline stroke="#7a5a24" points="72,22 84,22"/>
<polyline stroke="#7a5a24" points="78,16 78,28"/>
</svg>
<figcaption><h3>The Moon Over the Glass</h3><p>A thin silver moon that slipped in past the snowy window while I was busy tidying, with a little star winking beside it.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="Four stacked flat floors, each shorter than the one below, with a seed on top">
<polyline stroke="#7a5a24" points="20,85 80,85"/>
<polyline stroke="#7a5a24" points="28,68 72,68"/>
<polyline stroke="#7a5a24" points="36,51 64,51"/>
<polyline stroke="#7a5a24" points="44,36 56,36"/>
<polyline stroke="#7a5a24" points="50,85 50,36"/>
<polyline stroke="#7a5a24" points="46,28 48,26 52,26 54,28"/>
</svg>
<figcaption><h3>The Tiered Seed Tower</h3><p>I drew my seed tower in the sand, with each little floor stacked smaller than the one under it and a fat seed balanced on top.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="Two glass walls meeting in a corner, with a small arch scooped into the crook">
<polyline stroke="#3a3238" points="50,10 50,80"/>
<polyline stroke="#7a5a24" points="50,10 15,25 15,85 50,80"/>
<polyline stroke="#7a5a24" points="50,10 85,25 85,85 50,80"/>
<polyline stroke="#d49a1e" points="15,85 30,95 70,95 85,85"/>
<polyline stroke="#fff6da" points="38,80 38,55 44,45 50,42 56,45 62,55 62,80"/>
<polyline stroke="#4a86b8" points="30,57 44,60"/>
<polyline stroke="#4a86b8" points="30,66 44,64"/>
</svg>
<figcaption><h3>Where Two Walls Meet</h3><p>The glass corner where two walls bend together, with a snug arch scooped into the crook and my whiskers poking out to feel every edge.</p></figcaption>
</figure></li>

<li><figure>
<svg viewBox="0 0 100 100" role="img" aria-label="A window pane with long wobbly rain lines and two drops">
<polyline stroke="#3a3238" points="10,8 90,8 90,92 10,92 10,8"/>
<polyline stroke="#3a3238" points="50,8 50,92"/>
<polyline stroke="#4a86b8" points="22,15 20,40 18,60"/>
<polyline stroke="#4a86b8" points="32,20 30,46"/>
<polyline stroke="#4a86b8" points="65,12 62,35 60,52 59,70"/>
<polyline stroke="#4a86b8" points="78,22 76,48"/>
<polyline stroke="#4a86b8" points="30,70 27,76 30,82 34,76 30,70"/>
<polyline stroke="#fff6da" points="70,78 78,74 84,80 78,86 70,78"/>
</svg>
<figcaption><h3>Rain Streaks on the Glass</h3><p>Cold rain running down the window in long wobbly lines, with one fat drop hanging at the bottom, while I sit on the other side of the pane and watch it go.</p></figcaption>
</figure></li>

</ul>
</section>
</main>
<footer class="tiny">Hung by Pepper. More drawings go up when the sand is smooth again.</footer>
</body>
</html>
